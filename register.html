<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>إنشاء حساب — عبدالله عباس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body style="visibility:hidden">

  <div class="auth-layout">

    <!-- ========== BRAND PANEL ========== -->
    <div class="auth-brand-panel" aria-hidden="true">
      <div class="auth-brand-content">
        <span class="auth-brand-label">حلول رقمية</span>
        <h2 class="auth-brand-name">
          <span>عبدالله</span>
          <span>عباس</span>
        </h2>
        <div class="auth-brand-line"></div>
        <p class="auth-brand-desc">بناء حلول رقمية متكاملة تتميز بالجودة والاحترافية</p>
      </div>
      <p class="auth-brand-copy">&copy; 2025 عبدالله عباس</p>
    </div>

    <!-- ========== FORM PANEL ========== -->
    <main class="auth-form-panel">
      <div class="auth-form-wrapper">

        <div class="auth-mobile-brand auth-animate-in">عبدالله عباس</div>

        <h1 class="auth-title auth-animate-in">إنشاء حساب</h1>
        <p class="auth-subtitle auth-animate-in">انضم إلينا للوصول لخدماتنا ومنتجاتك</p>

        <div id="authMessage" class="auth-message auth-animate-in" role="alert" aria-live="polite"></div>

        <form id="registerForm" class="auth-form auth-animate-in" novalidate>
          <!-- الاسم -->
          <div class="form-group">
            <label for="displayName" class="form-label">الاسم الكامل</label>
            <input
              type="text"
              id="displayName"
              name="displayName"
              class="form-input"
              autocomplete="name"
              required
              maxlength="60"
            />
            <div id="nameError" class="field-error" aria-live="polite"></div>
          </div>

          <!-- البريد الإلكتروني -->
          <div class="form-group">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              autocomplete="email"
              required
              spellcheck="false"
            />
            <div id="emailError" class="field-error" aria-live="polite"></div>
          </div>

          <!-- كلمة المرور -->
          <div class="form-group">
            <label for="password" class="form-label">كلمة المرور</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                autocomplete="new-password"
                required
                minlength="8"
              />
              <button type="button" id="passwordToggle" class="password-toggle" aria-label="إظهار كلمة المرور"></button>
            </div>
            <div id="passwordError" class="field-error" aria-live="polite"></div>
          </div>

          <!-- تأكيد كلمة المرور -->
          <div class="form-group">
            <label for="confirmPassword" class="form-label">تأكيد كلمة المرور</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="form-input"
                autocomplete="new-password"
                required
                minlength="8"
              />
              <button type="button" id="confirmToggle" class="password-toggle" aria-label="إظهار كلمة المرور"></button>
            </div>
            <div id="confirmError" class="field-error" aria-live="polite"></div>
          </div>

          <button type="submit" class="auth-btn" id="submitBtn">
            <span class="btn-text">إنشاء الحساب</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>

        <div class="auth-link-row auth-animate-in">
          <span>لديك حساب بالفعل؟</span>
          <a href="/login.html">تسجيل الدخول</a>
        </div>

      </div>
    </main>

  </div>

  <script type="module">
    import { auth } from "/js/firebase-init.js";
    import { getIdTokenResult } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { register, validateName, validateEmail, validatePassword, validateConfirmPassword } from "/js/auth.js";
    import { showUserMessage, clearUserMessage, showFieldError, clearFieldError } from "/js/error-handler.js";
    import { setButtonLoading, initPasswordToggle, setInputError } from "/js/ui.js";

    // --- DOM ---
    const form = document.getElementById("registerForm");
    const nameInput = document.getElementById("displayName");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const submitBtn = document.getElementById("submitBtn");

    // --- Init toggles ---
    initPasswordToggle(document.getElementById("passwordToggle"), passwordInput);
    initPasswordToggle(document.getElementById("confirmToggle"), confirmInput);

    // --- Clear errors on input ---
    const clearErrors = (inputId, errorId) => {
      document.getElementById(inputId).addEventListener("input", () => {
        clearFieldError(errorId);
        setInputError(document.getElementById(inputId), false);
        clearUserMessage("authMessage");
      });
    };
    clearErrors("displayName", "nameError");
    clearErrors("email", "emailError");
    clearErrors("password", "passwordError");
    clearErrors("confirmPassword", "confirmError");

    // --- Auth redirect check ---
    let redirectDone = false;
    const unsub = auth.onAuthStateChanged(async (user) => {
      unsub();
      if (user && !redirectDone) {
        redirectDone = true;
        try {
          const r = await getIdTokenResult(user);
          window.location.replace(r.claims.admin ? "/admin/admin.html" : "/dashboard/dashboard.html");
          return;
        } catch { /* فشل Token */ }
      }
      document.body.style.visibility = "visible";
    });

    // --- Submit ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      clearUserMessage("authMessage");
      ["nameError","emailError","passwordError","confirmError"].forEach(clearFieldError);
      [nameInput, emailInput, passwordInput, confirmInput].forEach(i => setInputError(i, false));

      const name = nameInput.value;
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirm = confirmInput.value;
      let hasErr = false;

      const nv = validateName(name);
      if (!nv.valid) { showFieldError("nameError", nv.message); setInputError(nameInput, true); hasErr = true; }

      const ev = validateEmail(email);
      if (!ev.valid) { showFieldError("emailError", ev.message); setInputError(emailInput, true); hasErr = true; }

      const pv = validatePassword(password);
      if (!pv.valid) { showFieldError("passwordError", pv.message); setInputError(passwordInput, true); hasErr = true; }

      const cv = validateConfirmPassword(password, confirm);
      if (!cv.valid) { showFieldError("confirmError", cv.message); setInputError(confirmInput, true); hasErr = true; }

      if (hasErr) {
        const first = form.querySelector(".form-input--error");
        if (first) first.focus();
        return;
      }

      setButtonLoading(submitBtn, true);
      const result = await register(email, password, name);
      setButtonLoading(submitBtn, false);

      if (result.ok) {
        showUserMessage("authMessage", "تم إنشاء الحساب بنجاح. جارٍ التحويل...", "success");
        setTimeout(() => {
          window.location.replace("/dashboard/dashboard.html");
        }, 1200);
      } else {
        showUserMessage("authMessage", result.userMessage, "error");
        if (result.userMessage.includes("مسجل")) {
          setInputError(emailInput, true);
          emailInput.focus();
        }
      }
    });
  </script>
</body>
</html>
