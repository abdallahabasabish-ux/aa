<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب | Abdallah Abas</title>
    <meta name="description" content="أنشئ حساباً جديداً في منصة Abdallah Abas" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://abdallahsst.web.app/register.html" />
    <link rel="icon" href="assets/favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- التصميم الرئيسي -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
        /* نفس تنسيقات login.html */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gray-100);
            padding: 2rem 1.5rem;
        }
        .auth-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--gray-200);
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
        }
        .auth-container .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-container .logo a {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--black);
        }
        .auth-container .logo a span {
            color: var(--primary);
        }
        .auth-container .logo p {
            color: var(--gray-500);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }
        .auth-container h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
            text-align: center;
        }
        .auth-container .subtitle {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.3rem;
            font-size: 0.95rem;
            color: var(--gray-700);
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-family: var(--font-ar);
            font-size: 1rem;
            transition: var(--transition);
            background: var(--white);
            color: var(--gray-900);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.06);
        }
        .form-group .input-hint {
            font-size: 0.8rem;
            color: var(--gray-400);
            margin-top: 0.2rem;
        }
        .btn-auth {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            margin-top: 0.5rem;
        }
        .btn-auth-primary {
            background: var(--primary);
            color: var(--white);
        }
        .btn-auth-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(var(--primary-rgb), 0.25);
        }
        .btn-auth-google {
            background: var(--white);
            color: var(--gray-700);
            border: 2px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
        .btn-auth-google:hover {
            border-color: var(--primary);
            background: rgba(var(--primary-rgb), 0.04);
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--gray-400);
            font-size: 0.85rem;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: var(--gray-500);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        #authError {
            color: #EF4444;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            min-height: 1.5rem;
        }
        #authSuccess {
            color: #22C55E;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            min-height: 1.5rem;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray-500);
            font-size: 0.9rem;
            transition: var(--transition);
            margin-bottom: 1.5rem;
        }
        .back-home:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <section class="auth-page">
        <div class="auth-container">
            <!-- رجوع للرئيسية -->
            <a href="/" class="back-home"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>

            <!-- الشعار -->
            <div class="logo">
                <a href="/">Abdallah <span>Abas</span></a>
                <p>منصة خدمات رقمية احترافية</p>
            </div>

            <!-- العنوان -->
            <h1>إنشاء حساب جديد</h1>
            <p class="subtitle">انضم إلينا واستمتع بخدماتنا الرقمية</p>

            <!-- النموذج -->
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">الاسم كاملاً</label>
                    <input type="text" id="name" name="name" required placeholder="أدخل اسمك" />
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required placeholder="example@domain.com" />
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••" />
                    <div class="input-hint">كلمة المرور يجب أن تكون 6 أحرف على الأقل</div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="••••••••" />
                </div>

                <button type="submit" class="btn-auth btn-auth-primary" id="registerSubmitBtn">
                    <i class="fas fa-user-plus"></i> إنشاء حساب
                </button>
            </form>

            <!-- تسجيل الدخول بـ Google -->
            <button id="googleRegisterBtn" class="btn-auth btn-auth-google" style="margin-top:0.75rem;">
                <i class="fab fa-google"></i> إنشاء حساب بـ Google
            </button>

            <!-- الفاصل -->
            <div class="auth-divider">أو</div>

            <!-- روابط إضافية -->
            <div class="auth-footer">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>

            <!-- رسائل الخطأ والنجاح -->
            <div id="authError"></div>
            <div id="authSuccess"></div>
        </div>
    </section>

    <!-- ===== SCRIPTS ===== -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
    }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "firebase/auth";
        import { getFirestore, doc, setDoc } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyDg-oSbA_UdlzMS8HZGE0pHtr_zWg5rrXY",
            authDomain: "abdallahsst.firebaseapp.com",
            projectId: "abdallahsst",
            storageBucket: "abdallahsst.firebasestorage.app",
            messagingSenderId: "1011946194938",
            appId: "1:1011946194938:web:9bee94362711431368c643"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ===== عناصر الصفحة =====
        const form = document.getElementById('registerForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const errorDiv = document.getElementById('authError');
        const successDiv = document.getElementById('authSuccess');
        const submitBtn = document.getElementById('registerSubmitBtn');

        // ===== إنشاء حساب بالبريد وكلمة المرور =====
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.textContent = '';
            successDiv.textContent = '';

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            // تحقق من تطابق كلمة المرور
            if (password !== confirm) {
                errorDiv.textContent = '❌ كلمة المرور وتأكيدها غير متطابقين.';
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = '❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري إنشاء الحساب...';

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                // حفظ بيانات المستخدم في Firestore
                await setDoc(doc(db, "users", cred.user.uid), {
                    uid: cred.user.uid,
                    email: email,
                    displayName: name,
                    createdAt: new Date()
                });
                successDiv.textContent = '✅ تم إنشاء الحساب بنجاح! جاري التحويل...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (err) {
                let msg = err.message;
                if (err.code === 'auth/email-already-in-use') msg = '❌ هذا البريد الإلكتروني مستخدم بالفعل.';
                else if (err.code === 'auth/invalid-email') msg = '❌ البريد الإلكتروني غير صحيح.';
                else if (err.code === 'auth/weak-password') msg = '❌ كلمة المرور ضعيفة جداً.';
                errorDiv.textContent = msg;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب';
            }
        });

        // ===== إنشاء حساب بـ Google =====
        document.getElementById('googleRegisterBtn').addEventListener('click', async () => {
            errorDiv.textContent = '';
            successDiv.textContent = '';
            try {
                const result = await signInWithPopup(auth, provider);
                // حفظ بيانات المستخدم في Firestore
                await setDoc(doc(db, "users", result.user.uid), {
                    uid: result.user.uid,
                    email: result.user.email,
                    displayName: result.user.displayName || '',
                    photoURL: result.user.photoURL || '',
                    createdAt: new Date()
                });
                successDiv.textContent = '✅ تم إنشاء الحساب بنجاح! جاري التحويل...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (err) {
                errorDiv.textContent = '❌ ' + err.message;
            }
        });
    </script>
</body>
</html>
