<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة التحكم | Abdallah Abas</title>
    <!-- Same Fonts, CSS, CSP as login -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* نفس التنسيقات السابقة للوحة التحكم مع بعض التحسينات */

</head>
<body>
    <!-- Sidebar (نفس الهيكل السابق ولكن بدون روابط غير آمنة) -->
    <aside class="sidebar">...</aside>
    <main class="main-content">
        <section id="section-dashboard" class="page-section active">...</section>
        <section id="section-products" class="page-section">...</section>
        <section id="section-orders" class="page-section">...</section>
    </main>

    <script type="importmap">{"imports":{"firebase/":"https://www.gstatic.com/firebasejs/10.7.1/"}}</script>
    <script type="module">
        // ============================================
        // 1. AUTH GUARD (يمنع الدخول بدون صلاحية)
        // ============================================
        import { requireAdmin } from './js/auth-guard.js';
        import { auth, signOut, db, collection, doc, getDocs, updateDoc, deleteDoc, addDoc, query, orderBy, onSnapshot, serverTimestamp } from './js/firebase-init.js';
        import { createSafeElement, buildSafeTable } from './js/utils.js';

        // تنفيذ الحارس المركزي - إذا لم يكن Admin، سيتم إعادة التوجيه
        const user = await requireAdmin('/login.html');
        console.log(`✅ Welcome Admin: ${user.email}`);

        // ============================================
        // 2. عرض المنتجات (آمن تماماً من XSS)
        // ============================================
        const productsTableBody = document.getElementById('productsTableBody');

        function renderProductRow(doc) {
            const data = doc.data();
            const row = document.createElement('tr');
            
            // خلية الاسم (textContent آمن)
            const nameCell = document.createElement('td');
            nameCell.textContent = data.title || 'بدون عنوان';
            
            // خلية السعر
            const priceCell = document.createElement('td');
            priceCell.textContent = `$${data.price || 0}`;
            
            // خلية الفئة
            const catCell = document.createElement('td');
            catCell.textContent = data.category || 'عام';
            
            // خلية الحالة
            const statusCell = document.createElement('td');
            const statusSpan = document.createElement('span');
            statusSpan.className = `status-badge ${data.status === 'active' ? 'status-paid' : 'status-review'}`;
            statusSpan.textContent = data.status === 'active' ? 'منشور' : 'مسودة';
            statusCell.appendChild(statusSpan);
            
            // خلية الإجراءات (أزرار آمنة بدون onclick في HTML)
            const actionsCell = document.createElement('td');
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-sm btn-red';
            deleteBtn.innerHTML = '<i class="fa-regular fa-trash"></i>'; // أيقونة ثابتة آمنة
            deleteBtn.addEventListener('click', () => handleDeleteProduct(doc.id));
            actionsCell.appendChild(deleteBtn);
            
            row.appendChild(nameCell);
            row.appendChild(priceCell);
            row.appendChild(catCell);
            row.appendChild(statusCell);
            row.appendChild(actionsCell);
            return row;
        }

        async function loadProducts() {
            const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                const fragment = document.createDocumentFragment();
                snapshot.forEach(doc => {
                    fragment.appendChild(renderProductRow(doc));
                });
                productsTableBody.innerHTML = ''; // تفريغ آمن
                productsTableBody.appendChild(fragment);
            });
        }

        // ============================================
        // 3. دوال الحذف (غير معممة للنطاق العام)
        // ============================================
        async function handleDeleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            try {
                await deleteDoc(doc(db, 'products', id));
            } catch (e) { alert('خطأ في الحذف'); }
        }

        // ============================================
        // 4. إضافة منتج (مع تحقق من الصحة)
        // ============================================
        document.getElementById('addProductForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            // ... جلب البيانات
            // التحقق من صحة البيانات قبل الإرسال
            if (!title || price < 0) {
                alert('بيانات غير صحيحة');
                return;
            }
            // إرسال إلى Firestore (معتمد على Security Rules)
            await addDoc(collection(db, 'products'), { 
                title, 
                price, 
                status: 'active',
                // ... 
            });
        });

        // ============================================
        // 5. تحميل البيانات الأولية
        // ============================================
        loadProducts();
        // loadOrders(); // بنفس النمط الآمن

        // ============================================
        // 6. Logout آمن
        // ============================================
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = '/login.html';
        });

    </script>
</body>
</html>
