<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>تسجيل الدخول — عبدالله عباس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body style="visibility:hidden">

  <div class="auth-layout">
    
    <!-- ========== BRAND PANEL (right in RTL) ========== -->
    <div class="auth-brand-panel" aria-hidden="true">
      <div class="auth-brand-content">
        <span class="auth-brand-label">حلول رقمية</span>
        <h2 class="auth-brand-name">
          <span>عبدالله</span>
          <span>عباس</span>
        </h2>
        <div class="auth-brand-line"></div>
        <p class="auth-brand-desc">بناء حلول رقمية متكاملة تتميز بالجودة والاحترافية</p>
      </div>
      <p class="auth-brand-copy">&copy; 2025 عبدالله عباس</p>
    </div>

    <!-- ========== FORM PANEL (left in RTL) ========== -->
    <main class="auth-form-panel">
      <div class="auth-form-wrapper">

        <!-- Mobile brand -->
        <div class="auth-mobile-brand auth-animate-in">عبدالله عباس</div>

        <h1 class="auth-title auth-animate-in">تسجيل الدخول</h1>
        <p class="auth-subtitle auth-animate-in">لوحة إدارة المشروع</p>

        <div id="authMessage" class="auth-message auth-animate-in" role="alert" aria-live="polite"></div>

        <form id="loginForm" class="auth-form auth-animate-in" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              autocomplete="email"
              required
              spellcheck="false"
              autofocus
            />
            <div id="emailError" class="field-error" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">كلمة المرور</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                autocomplete="current-password"
                required
                minlength="8"
              />
              <button type="button" id="passwordToggle" class="password-toggle" aria-label="إظهار كلمة المرور"></button>
            </div>
            <div id="passwordError" class="field-error" aria-live="polite"></div>
          </div>

          <button type="submit" class="auth-btn" id="submitBtn">
            <span class="btn-text">تسجيل الدخول</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>

        <a href="/forgot-password.html" class="auth-link auth-animate-in">نسيت كلمة المرور؟</a>

      </div>
    </main>

  </div>

  <script type="module">
    import { auth } from "/js/firebase-init.js";
    import { getIdTokenResult } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { login, validateEmail, validatePassword } from "/js/auth.js";
    import { showUserMessage, clearUserMessage, showFieldError, clearFieldError } from "/js/error-handler.js";
    import { setButtonLoading, initPasswordToggle, setInputError } from "/js/ui.js";

    // --- DOM ---
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");
    const submitBtn = document.getElementById("submitBtn");
    const msgContainer = document.getElementById("authMessage");

    // --- Init password toggle ---
    initPasswordToggle(passwordToggle, passwordInput);

    // --- Clear errors on input ---
    emailInput.addEventListener("input", () => {
      clearFieldError("emailError");
      setInputError(emailInput, false);
      clearUserMessage("authMessage");
    });
    passwordInput.addEventListener("input", () => {
      clearFieldError("passwordError");
      setInputError(passwordInput, false);
      clearUserMessage("authMessage");
    });

    // --- Auth redirect check ---
    let redirectDone = false;
    const unsub = auth.onAuthStateChanged(async (user) => {
      unsub();
      if (user && !redirectDone) {
        redirectDone = true;
        try {
          const r = await getIdTokenResult(user);
          window.location.replace(r.claims.admin ? "/admin/admin.html" : "/dashboard/dashboard.html");
          return;
        } catch { /* فشل Token — اعرض النموذج */ }
      }
      // إظهار الصفحة
      document.body.style.visibility = "visible";
    });

    // --- Submit ---
    function initForm() {
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        clearUserMessage("authMessage");
        clearFieldError("emailError");
        clearFieldError("passwordError");
        setInputError(emailInput, false);
        setInputError(passwordInput, false);

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        let hasErr = false;

        const ev = validateEmail(email);
        if (!ev.valid) { showFieldError("emailError", ev.message); setInputError(emailInput, true); hasErr = true; }

        const pv = validatePassword(password);
        if (!pv.valid) { showFieldError("passwordError", pv.message); setInputError(passwordInput, true); hasErr = true; }

        if (hasErr) {
          const first = form.querySelector(".form-input--error");
          if (first) first.focus();
          return;
        }

        setButtonLoading(submitBtn, true);
        const result = await login(email, password);
        setButtonLoading(submitBtn, false);

        if (result.ok) {
          window.location.replace(result.claims?.admin ? "/admin/admin.html" : "/dashboard/dashboard.html");
        } else {
          showUserMessage("authMessage", result.userMessage, "error");
          if (result.userMessage.includes("غير صحيحة")) {
            setInputError(emailInput, true);
            setInputError(passwordInput, true);
          }
          emailInput.focus();
        }
      });
    }

    initForm();
  </script>
</body>
</html>
