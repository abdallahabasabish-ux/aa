<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>إعادة تعيين كلمة المرور — عبدالله عباس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body style="visibility:hidden">

  <div class="auth-layout">

    <!-- ========== BRAND PANEL ========== -->
    <div class="auth-brand-panel" aria-hidden="true">
      <div class="auth-brand-content">
        <span class="auth-brand-label">حلول رقمية</span>
        <h2 class="auth-brand-name">
          <span>Abdallah</span>
          <span>Abas</span>
        </h2>
        <div class="auth-brand-line"></div>
        <p class="auth-brand-desc">بناء حلول رقمية متكاملة تتميز بالجودة والاحترافية</p>
      </div>
      <p class="auth-brand-copy">&copy; 2025 Abdallah Abas</p>
    </div>

    <!-- ========== FORM PANEL ========== -->
    <main class="auth-form-panel">
      <div class="auth-form-wrapper">

        <div class="auth-mobile-brand auth-animate-in">Abdallah Abas</div>

        <h1 class="auth-title auth-animate-in">استعادة كلمة المرور</h1>
        <p class="auth-subtitle auth-animate-in">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين</p>

        <div id="authMessage" class="auth-message auth-animate-in" role="alert" aria-live="polite"></div>

        <form id="resetForm" class="auth-form auth-animate-in" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              autocomplete="email"
              required
              spellcheck="false"
              autofocus
            />
            <div id="emailError" class="field-error" aria-live="polite"></div>
          </div>

          <button type="submit" class="auth-btn" id="submitBtn">
            <span class="btn-text">إرسال رابط الاستعادة</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>

        <div class="auth-link-row auth-animate-in">
          <span>تتذكر كلمة المرور؟</span>
          <a href="/login.html">تسجيل الدخول</a>
        </div>

      </div>
    </main>

  </div>

  <script type="module">
    import { auth } from "/js/firebase-init.js";
    import { getIdTokenResult } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { resetPassword, validateEmail } from "/js/auth.js";
    import { showUserMessage, clearUserMessage, showFieldError, clearFieldError } from "/js/error-handler.js";
    import { setButtonLoading, setInputError } from "/js/ui.js";

    const form = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");

    emailInput.addEventListener("input", () => {
      clearFieldError("emailError");
      setInputError(emailInput, false);
      clearUserMessage("authMessage");
    });

    // --- Auth redirect check ---
    let redirectDone = false;
    const unsub = auth.onAuthStateChanged(async (user) => {
      unsub();
      if (user && !redirectDone) {
        redirectDone = true;
        try {
          const r = await getIdTokenResult(user);
          window.location.replace(r.claims.admin ? "/admin/admin.html" : "/dashboard/dashboard.html");
          return;
        } catch { /* فشل Token */ }
      }
      document.body.style.visibility = "visible";
    });

    let submitted = false;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submitted) return;

      clearUserMessage("authMessage");
      clearFieldError("emailError");
      setInputError(emailInput, false);

      const email = emailInput.value.trim();
      const ev = validateEmail(email);
      if (!ev.valid) {
        showFieldError("emailError", ev.message);
        setInputError(emailInput, true);
        emailInput.focus();
        return;
      }

      setButtonLoading(submitBtn, true);
      const result = await resetPassword(email);
      setButtonLoading(submitBtn, false);

      if (result.ok) {
        submitted = true;
        showUserMessage("authMessage", result.userMessage, "success");
        submitBtn.disabled = true;
      } else {
        showUserMessage("authMessage", result.userMessage, "error");
        emailInput.focus();
      }
    });
  </script>
</body>
</html>
